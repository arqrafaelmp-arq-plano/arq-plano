<title>Arq-plano</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --font-d:'Outfit',system-ui,-apple-system,sans-serif;
  --font-b:'DM Sans',system-ui,-apple-system,sans-serif;
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-h:#EEF0F4;
  --text:#232840;--text-2:#565C78;--text-3:#9AA0B4;
  --accent:#232840;--accent-h:#171A2C;--accent-bg:#EDEFF5;
  --ok:#3E7A5E;--ok-bg:#EBF5EF;--warn:#B0812E;--warn-bg:#FBF3E4;
  --err:#B8493F;--err-bg:#FBEDEA;
  --border:#E3E5EC;--border-2:#C7CCDA;
  --shadow:0 1px 3px rgba(15,23,42,0.06);--shadow-m:0 4px 12px rgba(15,23,42,0.08);
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161F;--surface:#1D2030;--surface-h:#262A3D;
  --text:#E7E9F0;--text-2:#A7ACC0;--text-3:#6D7288;
  --accent:#9BA1C4;--accent-h:#B0B5D4;--accent-bg:#262A42;
  --ok:#7FB090;--ok-bg:#1F3229;--warn:#E0B26A;--warn-bg:#3A2C15;
  --err:#E37A6A;--err-bg:#3A1E19;
  --border:#2C3040;--border-2:#3E4358;
  --shadow:0 1px 3px rgba(0,0,0,0.3);--shadow-m:0 4px 12px rgba(0,0,0,0.4);
}}
:root[data-theme="dark"]{
  --bg:#14161F;--surface:#1D2030;--surface-h:#262A3D;
  --text:#E7E9F0;--text-2:#A7ACC0;--text-3:#6D7288;
  --accent:#9BA1C4;--accent-h:#B0B5D4;--accent-bg:#262A42;
  --ok:#7FB090;--ok-bg:#1F3229;--warn:#E0B26A;--warn-bg:#3A2C15;
  --err:#E37A6A;--err-bg:#3A1E19;
  --border:#2C3040;--border-2:#3E4358;
  --shadow:0 1px 3px rgba(0,0,0,0.3);--shadow-m:0 4px 12px rgba(0,0,0,0.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:600;line-height:1.25;text-wrap:balance}
h1{font-size:1.75rem}h2{font-size:1.35rem}h3{font-size:1.1rem}
input,select,textarea,button{font-family:inherit;font-size:inherit}

.header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;display:flex;align-items:center;gap:1rem;box-shadow:var(--shadow)}
.header-brand{display:flex;align-items:center;background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;transition:background .15s;line-height:0}
.header-brand:hover{background:var(--accent-bg)}
.header-brand img.brand-img{height:34px;width:auto;display:block}
/* Logo é azul-marinho escuro: clareia no modo escuro para manter contraste */
:root[data-theme="dark"] img.brand-img{filter:brightness(0) invert(1) opacity(.92)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) img.brand-img{filter:brightness(0) invert(1) opacity(.92)}}
.brand-text-wrap{display:flex;flex-direction:column;line-height:1}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-badge{font-size:.7rem;padding:3px 9px;border-radius:20px;font-weight:600;letter-spacing:.02em;transition:all .2s;white-space:nowrap}
.sync-idle{background:var(--ok-bg);color:var(--ok)}
.sync-saving{background:var(--warn-bg);color:var(--warn)}
.sync-error{background:var(--err-bg);color:var(--err)}
.header-user{font-size:.8rem;color:var(--text-2);margin-right:.25rem;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){.header-user{display:none}.sync-badge{display:none}}
.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:40px!important;width:100%}
.pwd-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-3);cursor:pointer;padding:6px;border-radius:4px;display:flex;align-items:center}
.pwd-toggle:hover{color:var(--accent);background:var(--accent-bg)}
.remember-row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--text-2);margin:-.5rem 0 1rem;cursor:pointer;user-select:none}
.remember-row input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.header-nav{margin-left:auto;display:flex;align-items:center;gap:.75rem}
.header-btn{background:none;border:none;color:var(--text-2);cursor:pointer;padding:6px;border-radius:6px;display:flex;align-items:center}
.header-btn:hover{background:var(--surface-h);color:var(--text)}
.main{padding:1.5rem;min-height:calc(100vh - 56px)}.container{max-width:1100px;margin:0 auto}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--r);font-weight:500;cursor:pointer;border:none;font-size:.875rem;transition:all .15s;line-height:1.4}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent-h)}
.btn-s{background:var(--surface);color:var(--text);border:1px solid var(--border)}.btn-s:hover{border-color:var(--border-2);background:var(--surface-h)}
.btn-d{background:var(--err-bg);color:var(--err);border:1px solid transparent}.btn-d:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}.btn-lg{padding:10px 24px;font-size:1rem}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{opacity:.9}
.btn-ghost{background:none;border:none;color:var(--accent);padding:4px 8px;font-size:.8rem;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.btn-ghost svg{width:12px;height:12px;flex-shrink:0}
.btn-ghost:hover{background:var(--accent-bg);border-radius:4px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat{background:var(--surface);border-radius:var(--rl);padding:1.25rem;border:1px solid var(--border)}
.stat-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:4px;font-weight:500}
.stat-val{font-family:var(--font-d);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat-val.c-accent{color:var(--accent)}.stat-val.c-ok{color:var(--ok)}.stat-val.c-warn{color:var(--warn)}
.stat-val.c-plan{color:var(--text-2)}

.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.75rem}
.filters{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border-radius:var(--r);padding:3px;border:1px solid var(--border)}
.filter-btn{padding:5px 14px;border:none;background:none;border-radius:6px;font-size:.8rem;font-weight:500;cursor:pointer;color:var(--text-2);transition:all .15s;white-space:nowrap}
@media(max-width:480px){.filter-btn{padding:5px 9px;font-size:.72rem}}
.filter-select{display:none}
@media(max-width:480px){.dash-filters{display:none}.filter-select{display:block;flex:1 1 100%}}
.filter-btn.active{background:var(--accent);color:#fff}.filter-btn:not(.active):hover{background:var(--surface-h)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.card{background:var(--surface);border-radius:var(--rl);border:1px solid var(--border);padding:1.25rem;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.card:hover{box-shadow:var(--shadow-m);border-color:var(--border-2)}
.card-stripe{position:absolute;top:0;left:0;width:4px;height:100%;border-radius:4px 0 0 4px}
.card-body{padding-left:12px}
.card-type{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:4px}
.card-title{font-family:var(--font-d);font-weight:600;font-size:1.05rem;margin-bottom:2px}
.card-sub{font-size:.8rem;color:var(--text-2);margin-bottom:.75rem}
.card-progress{height:6px;background:var(--surface-h);border-radius:3px;overflow:hidden;margin-bottom:.5rem}
.card-progress-fill{height:100%;border-radius:3px;transition:width .3s}
.card-footer{display:flex;justify-content:space-between;font-size:.75rem;color:var(--text-3)}

.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge-ok{background:var(--ok-bg);color:var(--ok)}.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-accent{background:var(--accent-bg);color:var(--accent)}.badge-err{background:var(--err-bg);color:var(--err)}
.badge-plan{background:var(--surface-h);color:var(--text-2);border:1px solid var(--border)}
.badge-paused{background:var(--err-bg);color:var(--err)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.card-top .card-type{margin-bottom:0}

.empty{text-align:center;padding:4rem 1rem;color:var(--text-3)}
.empty svg{width:36px;height:36px;margin-bottom:1rem;opacity:.4}
.empty h3{color:var(--text-2);margin-bottom:.5rem}.empty p{font-size:.9rem;margin-bottom:1.5rem}

.wizard{max-width:740px;margin:0 auto}
.steps{display:flex;gap:4px;margin-bottom:2rem}
.step{flex:1;text-align:center;padding:10px 8px;font-size:.75rem;font-weight:500;border-bottom:3px solid var(--border);color:var(--text-3);transition:all .15s}
.step.active{border-color:var(--accent);color:var(--accent);font-weight:600}
.step.done{border-color:var(--ok);color:var(--ok)}
.wiz-title{font-family:var(--font-d);font-size:1.25rem;font-weight:600;margin-bottom:.25rem}
.wiz-sub{color:var(--text-2);font-size:.9rem;margin-bottom:1.5rem}

.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.type-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--rl);padding:1.25rem;cursor:pointer;transition:all .15s;text-align:center}
.type-card:hover{border-color:var(--border-2);box-shadow:var(--shadow)}
.type-card.selected{border-color:var(--accent);background:var(--accent-bg)}
.type-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem;font-family:var(--font-d);font-weight:700;font-size:1rem;color:#fff}
.type-card h4{font-size:.95rem;margin-bottom:4px}.type-card p{font-size:.75rem;color:var(--text-2);line-height:1.4}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.form-row.full{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.8rem;font-weight:500;color:var(--text-2)}
.form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:.9rem;transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}

.phase-groups{display:flex;flex-direction:column;gap:1.25rem}
.phase-group h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin-bottom:.5rem;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.phase-list{display:flex;flex-direction:column;gap:6px}
.phase-item{display:flex;align-items:center;flex-wrap:wrap;row-gap:4px;gap:.5rem;padding:8px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);transition:all .1s}
.phase-item:hover{background:var(--surface-h)}
.phase-item input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.phase-item .name{flex:1 1 100px;min-width:100px;font-size:.875rem}
.phase-item .name-input{flex:1;padding:2px 6px;border:1px solid var(--accent);border-radius:4px;font-size:.875rem;background:var(--surface);color:var(--text)}
.phase-item .meta{font-size:.75rem;color:var(--text-3);white-space:nowrap;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:480px){.phase-item .meta{margin-left:26px}}
.phase-item .meta .qty-inline{width:52px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:.75rem;background:var(--surface);color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.phase-item .meta .qty-inline:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.phase-item .meta .total{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.phase-item-editing{align-items:flex-start;flex-wrap:wrap}
.phase-item-editing .name-input{min-width:160px}
.edit-meta{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:2px}
.fld-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600;white-space:nowrap}
.edit-meta .fld-total{font-size:.85rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;padding:3px 5px;white-space:nowrap}
.ph-btn,.phase-item .ph-btn,.phase-group h4 .ph-btn{background:var(--surface-h);border:1px solid var(--border);cursor:pointer;color:var(--text-2);padding:5px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;line-height:0}
.ph-btn svg,.phase-item .ph-btn svg,.phase-group h4 .ph-btn svg{width:12px;height:12px}
.ph-btn:hover,.phase-item .ph-btn:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.phase-item .ph-btn.del:hover{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.add-phase-row{display:flex;flex-wrap:wrap;gap:.5rem;padding:6px 12px;align-items:center;margin-top:4px}
.add-phase-row input,.add-phase-row select{padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-size:.8rem;background:var(--surface);color:var(--text);min-width:0}
.add-phase-row input:focus{outline:none;border-color:var(--accent)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--rl);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
thead{background:var(--surface-h)}
th{padding:10px 14px;text-align:left;font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-h)}
.tbl-input{width:100%;padding:5px 8px;border:1px solid transparent;border-radius:4px;background:transparent;font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--text)}
.tbl-input:hover{border-color:var(--border)}.tbl-input:focus{outline:none;border-color:var(--accent);background:var(--accent-bg)}
.tbl-total{font-weight:600;background:var(--surface-h)}
td.r,th.r{text-align:right}
.wiz-actions{display:flex;justify-content:space-between;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border)}

.project-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
.back-btn{background:none;border:none;cursor:pointer;color:var(--text-2);display:flex;align-items:center;gap:4px;font-size:.85rem;font-weight:500;padding:6px 10px;border-radius:var(--r);transition:all .15s}
.back-btn:hover{background:var(--surface-h);color:var(--text)}
.back-btn svg{width:14px;height:14px}
.project-header h1{flex:1;min-width:0;display:flex;align-items:center;gap:.5rem}
.proj-name-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.edit-name-btn{flex-shrink:0}
@media(max-width:640px){.project-header h1{flex:1 1 100%;font-size:1.3rem}}
.proj-name-input{font-family:var(--font-d);font-size:1.75rem;font-weight:600;border:1px solid var(--accent);border-radius:var(--r);padding:2px 8px;background:var(--surface);color:var(--text);width:100%;max-width:400px}
.edit-name-btn{background:none;border:none;cursor:pointer;color:var(--text-3);display:flex;padding:4px}
.edit-name-btn svg{width:12px;height:12px}
.edit-name-btn:hover{color:var(--accent)}

.tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:1.5rem;overflow-x:auto;position:sticky;top:56px;background:var(--bg);z-index:90;padding-top:4px}
.tab{padding:10px 18px;font-size:.85rem;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--text-2);transition:all .15s;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:1.5rem}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem}
.sum-card h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin-bottom:.5rem}
.sum-card .val{font-family:var(--font-d);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.sum-card .sub{font-size:.8rem;color:var(--text-2);margin-top:4px}
.prog-bar{height:10px;background:var(--surface-h);border-radius:5px;overflow:hidden;margin-top:8px}
.prog-fill{height:100%;border-radius:5px;transition:width .3s}

.select-status{padding:4px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:.8rem;cursor:pointer}
.select-status:focus{outline:none;border-color:var(--accent)}

/* Agenda Timeline */
.agenda{display:flex;flex-direction:column;gap:.5rem}
.agenda-month{font-family:var(--font-d);font-size:1rem;font-weight:600;color:var(--accent);padding:1rem 0 .5rem;border-bottom:2px solid var(--accent);margin-top:.75rem;text-transform:uppercase;letter-spacing:.04em}
.agenda-month:first-child{margin-top:0}
.agenda-item{display:grid;grid-template-columns:80px 1fr;gap:1rem;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);border-left:4px solid var(--accent);transition:all .1s}
.agenda-item:hover{box-shadow:var(--shadow);border-color:var(--border-2)}
.agenda-date{font-family:var(--font-d);text-align:center}
.agenda-date .day{font-size:1.5rem;font-weight:700;line-height:1;color:var(--text)}
.agenda-date .month-s{font-size:.7rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.agenda-info h4{font-size:.9rem;font-weight:500;margin-bottom:2px}
.agenda-info .agenda-meta{font-size:.75rem;color:var(--text-2);display:flex;gap:1rem;flex-wrap:wrap}
.agenda-info .agenda-meta span{display:flex;align-items:center;gap:3px}
.agenda-status{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.agenda-status.st-done{background:var(--ok)}.agenda-status.st-prog{background:var(--warn)}.agenda-status.st-wait{background:var(--text-3)}

/* Cronograma - Calendário */
.crono-cal{margin-top:.25rem}
.crono-cal-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem}
.crono-cal-title{font-family:var(--font-d);font-weight:600;font-size:1rem;text-transform:capitalize;min-width:130px;text-align:center}
.crono-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.crono-cal-wd{margin-bottom:4px}
.crono-cal-wd div{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--text-3);text-align:center}
.crono-cal-cell{position:relative;min-height:60px;padding:4px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:all .1s;overflow:hidden}
.crono-cal-cell:hover{border-color:var(--border-2)}
.crono-cal-cell.out{background:transparent;border-color:transparent;cursor:default;opacity:.3}
.crono-cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.crono-cal-cell.sel{background:var(--accent-bg)}
.cd-num{font-size:.72rem;font-weight:600;color:var(--text-2)}
.crono-cal-cell.today .cd-num{color:var(--accent)}
.cd-items{display:flex;flex-wrap:wrap;gap:3px;min-width:0;margin-top:auto}

  const diff=paid-realizado;
  if(Math.abs(diff)<=1)return{color:'var(--ok)',rot:0};
  if(diff>0)return{color:'var(--err)',rot:-15};
  return{color:'var(--warn)',rot:15};
}

function rowToProject(r){
  const p={
    id:r.id,name:r.name,type:r.type,client:r.client||'',address:r.address||'',
    startDate:r.start_date||'',status:r.status||'planejamento',

}

/* ============================================================
   SINCRONIZAÇÃO COM A NUVEM
   save() é chamado em todo lugar do app; aqui ele apenas marca
   o que mudou e agenda o envio, para não sobrecarregar o banco.
   ============================================================ */
const dirtyProjects=new Set();
let dirtySettings=false,flushTimer=null,flushing=false;

function setSync(state){
  if(S.syncState===state)return;
  S.syncState=state;
  const el=document.getElementById('sync-badge');
  if(el)el.className='sync-badge sync-'+state;
  if(el)el.textContent=state==='saving'?'Salvando…':state==='error'?'Erro ao salvar':'Salvo';
}

function save(){
  if(!S.userId)return;
  if(S.currentId)dirtyProjects.add(S.currentId);
  dirtySettings=true;
  scheduleFlush();
}
function saveProjectNow(id){
  if(!S.userId)return;
  dirtyProjects.add(id);
  scheduleFlush(0);
}
function scheduleFlush(delay){
  if(flushTimer)clearTimeout(flushTimer);
  setSync('saving');
  flushTimer=setTimeout(flushChanges,delay==null?900:delay);
}

async function flushChanges(){
  if(flushing){scheduleFlush(400);return}
  if(!S.userId)return;
  flushing=true;
  const ids=[...dirtyProjects];dirtyProjects.clear();
  const wantSettings=dirtySettings;dirtySettings=false;
  try{
    if(ids.length){
      const rows=ids.map(id=>S.projects.find(p=>p.id===id)).filter(Boolean).map(projectToRow);
      if(rows.length){
        const{error}=await sb.from('projects').upsert(rows,{onConflict:'id'});
        if(error)throw error;
      }
    }
    if(wantSettings){
      const{error}=await sb.from('profiles').upsert(settingsToRow(),{onConflict:'id'});
      if(error)throw error;
    }
    setSync('idle');
  }catch(e){
    // devolve para a fila e tenta de novo
    ids.forEach(id=>dirtyProjects.add(id));
    if(wantSettings)dirtySettings=true;
    setSync('error');
    console.error('Falha ao salvar:',e);
    scheduleFlush(5000);
  }finally{flushing=false}
}

// Garante o envio antes de fechar a aba
window.addEventListener('beforeunload',e=>{
  if(dirtyProjects.size||dirtySettings){
    flushChanges();
    e.preventDefault();e.returnValue='';
  }
});

   ============================================================ */
async function loadCloudData(){
  const[projRes,profRes]=await Promise.all([
    sb.from('projects').select('*').order('created_at',{ascending:false}),
    sb.from('profiles').select('*').eq('id',S.userId).maybeSingle()
  ]);
  if(projRes.error)throw projRes.error;
  S.projects=(projRes.data||[]).map(rowToProject);
  if(profRes.data)S.settings=rowToSettings(profRes.data);
  else await sb.from('profiles').upsert(settingsToRow(),{onConflict:'id'});
}

async function deleteProjectCloud(id){
  dirtyProjects.delete(id);
  const{error}=await sb.from('projects').delete().eq('id',id);
  if(error){showToast('Erro ao excluir: '+error.message);return false}
  return true;
}

   SESSÃO
   ============================================================ */
async function bootSession(){
  loadTheme();
  const shareToken=new URLSearchParams(location.search).get('share');
  if(shareToken){await bootSharedView(shareToken);return}
  const{data:{session}}=await sb.auth.getSession();
  if(session&&session.user){
    S.userId=session.user.id;
    S.currentUser=session.user.email;
    S.view='dashboard';
    render();
    try{await loadCloudData()}
    catch(e){showToast('Erro ao carregar dados: '+e.message)}
    render();
  }else{
    S.view='login';render();
  }
}

async function bootSharedView(token){
  S.view='shared-loading';render();
  try{
    const{data,error}=await sb.rpc('get_shared_project',{p_token:token});
    const row=Array.isArray(data)?data[0]:data;
    if(error||!row){S.view='shared-notfound';render();return}
    S.sharedData=row;
    S.view='shared';render();
  }catch(e){
    S.view='shared-notfound';render();
  }
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
// IDs das obras precisam ser UUID (formato exigido pelo banco)
function uuid(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);
  });
}

const CRC_TAB=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c}return t})();
function crc32(d){let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=CRC_TAB[(c^d[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function s2b(s){return new TextEncoder().encode(s)}
function makeZip(files){
  const parts=[],cd=[];let off=0;
  for(const f of files){
    const nb=s2b(f.name),dat=typeof f.data==='string'?s2b(f.data):f.data,crc=crc32(dat),sz=dat.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nb,dat);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0,true);
    c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);
    c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nb.length,true);c.setUint16(30,0,true);
    c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer),nb);
    off+=30+nb.length+sz;
  }
  const cdStart=off;let cdSz=0;for(const p of cd)cdSz+=p.length;
  const eocd=new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true);eocd.setUint16(4,0,true);eocd.setUint16(6,0,true);
  eocd.setUint16(8,files.length,true);eocd.setUint16(10,files.length,true);
  eocd.setUint32(12,cdSz,true);eocd.setUint32(16,cdStart,true);eocd.setUint16(20,0,true);
  const tot=off+cdSz+22,zip=new Uint8Array(tot);let pos=0;
  for(const p of parts){zip.set(p,pos);pos+=p.length}
  for(const p of cd){zip.set(p,pos);pos+=p.length}
  zip.set(new Uint8Array(eocd.buffer),pos);
  return zip;
}
function xEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function colL(i){let s='',n=i+1;while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}
function fmt(v){if(v==null||isNaN(v))return'R$ 0,00';return'R$ '+Number(v).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function fmtD(d){if(!d)return'—';const dt=new Date(d);return String(dt.getUTCDate()).padStart(2,'0')+'/'+String(dt.getUTCMonth()+1).padStart(2,'0')+'/'+dt.getUTCFullYear()}
function addDays(d,n){const r=new Date(d);r.setUTCDate(r.getUTCDate()+n);return r}

function compressImg(file,cb){
  const r=new FileReader();r.onload=function(e){
    const img=new Image();img.onload=function(){
      const c=document.createElement('canvas');let w=img.width,h=img.height;
      if(w>600){h=h*600/w;w=600}c.width=w;c.height=h;
      const ctx=c.getContext('2d');
      ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.6));
    };img.src=e.target.result;
  };r.readAsDataURL(file);
}
function getWeekStart(ds){const d=new Date(ds);const day=d.getUTCDay();d.setUTCDate(d.getUTCDate()-(day===0?6:day-1));return d.toISOString().slice(0,10)}

function calcSchedule(phases,start){
  let cur=new Date(start);
  return phases.map(p=>{const s=new Date(cur);cur=addDays(cur,p.duration);return{...p,startDate:s.toISOString().slice(0,10),endDate:cur.toISOString().slice(0,10)}});
}
function recalcFrom(phases,idx){
  for(let i=idx;i<phases.length;i++){
    if(i>idx)phases[i].startDate=phases[i-1].endDate;
    phases[i].endDate=addDays(phases[i].startDate,phases[i].duration).toISOString().slice(0,10);
  }
}

function projProgress(p){const t=projBudget(p);if(!t)return 0;return(p.phases||[]).reduce((s,ph)=>s+((ph.progress||0)/100)*(ph.totalCost||0),0)/t*100}
function fairPayment(p){const b=projBudget(p),pr=projProgress(p),f=b*(pr/100),pd=projPaid(p);return{budget:b,progress:pr,fair:f,paid:pd,delta:f-pd}}

function projCrono(p){
  if(!p.phases.length)return'<p style="color:var(--text-3)">Nenhuma etapa.</p>';
  const v=S.cronoView||'mes';
  const color=TYPES[p.type]?TYPES[p.type].color:'var(--accent)';

  let html='<div class="filters" style="margin-bottom:1rem;display:inline-flex;flex-wrap:wrap">'+
    ['mes','semana','dia','calendario'].map(k=>{
      const labels={mes:'Por Mês',semana:'Por Semana',dia:'Por Dia',calendario:'Calendário'};
      return'<button class="filter-btn'+(v===k?' active':'')+'" data-action="crono-view" data-view="'+k+'">'+labels[k]+'</button>';
    }).join('')+'</div>';

  if(v==='calendario')return html+renderCronoCalendar(p);

  const groups={};const gOrder=[];
  p.phases.forEach(ph=>{
    let key,label;
    if(v==='mes'){
      const d=new Date(ph.startDate);key=d.getUTCFullYear()+'-'+String(d.getUTCMonth()).padStart(2,'0');label=MONTHS[d.getUTCMonth()]+' '+d.getUTCFullYear();
    }else if(v==='semana'){
      key=getWeekStart(ph.startDate);label='Semana de '+weekLabel(key);
    }else{
      key=ph.startDate;label=fmtD(ph.startDate);
    }
    if(!groups[key]){groups[key]={label,phases:[]};gOrder.push(key)}
    groups[key].phases.push(ph);
  });

  const todayStr=todayLocal();
  html+='<div class="agenda">';
  gOrder.forEach(key=>{
    const g=groups[key];
    html+='<div class="agenda-month">'+g.label+'</div>';
    g.phases.forEach(ph=>{
      const d=new Date(ph.startDate);
      const isDelayed=ph.endDate&&ph.endDate<todayStr&&(ph.progress||0)<100;
      const stClass=ph.progress>=100?'st-done':ph.progress>0?'st-prog':'st-wait';
      const stLabel=ph.progress>=100?'Concluída':ph.progress>0?ph.progress+'% realizado':'Não iniciada';
      html+='<div class="agenda-item'+(isDelayed?' crono-delayed':'')+'" style="border-left-color:'+(isDelayed?'var(--err)':color)+'">'+
        '<div class="agenda-date"><div class="day"'+(isDelayed?' style="color:var(--err)"':'')+'>'+String(d.getUTCDate()).padStart(2,'0')+'</div><div class="month-s">'+MONTHS[d.getUTCMonth()].slice(0,3)+'</div></div>'+
        '<div class="agenda-info"><h4>'+(isDelayed?'<span class="crono-alert-inline">'+IC.alert+'</span>':'')+esc(ph.name)+(ph.additional?' <span class="additional-badge">ADICIONAL</span>':'')+'</h4><div class="agenda-meta" style="align-items:center">'+
          '<span title="Duração"><input class="tbl-input" type="number" min="1" value="'+ph.duration+'" data-action="edit-crono-dur" data-phase="'+ph.id+'" style="width:52px;text-align:right"> dias</span>'+
          '<span title="Início"><input class="tbl-input" type="date" value="'+ph.startDate+'" data-action="edit-crono-start" data-phase="'+ph.id+'" style="width:130px"></span>'+
          '<span>→ '+fmtD(ph.endDate)+'</span>'+
          '<span>'+esc(ph.cat)+'</span>'+
          (isDelayed?'<span class="crono-status-late">ATRASADA · '+stLabel+'</span>':'<span><span class="agenda-status '+stClass+'"></span>'+stLabel+'</span>')+
          '<span title="Custo total">R$ <input class="tbl-input" type="number" min="0" step="0.01" value="'+(+(ph.totalCost||0).toFixed(2))+'" data-action="edit-crono-cost" data-phase="'+ph.id+'" style="width:90px;text-align:right"></span>'+
        '</div></div></div>';
    });
  });
  html+='</div>';
  return html;
}

function renderCronoCalendar(p){
  const todayStr=todayLocal();
  if(!S.cronoCalMonth){
    const inRange=p.phases.some(ph=>ph.startDate<=todayStr&&(ph.endDate||ph.startDate)>=todayStr);
    S.cronoCalMonth=(inRange?todayStr:p.phases[0].startDate).slice(0,7);
  }
  const[yy,mm]=S.cronoCalMonth.split('-').map(Number),mi=mm-1;
  const firstDow=new Date(Date.UTC(yy,mi,1)).getUTCDay();
  const daysInMonth=new Date(Date.UTC(yy,mi+1,0)).getUTCDate();
  const prevDays=new Date(Date.UTC(yy,mi,0)).getUTCDate();

  const byDay={};
  p.phases.forEach(ph=>{
    if(!ph.startDate)return;
    const end=ph.endDate||ph.startDate;
    let d=new Date(ph.startDate+'T00:00:00Z');const endD=new Date(end+'T00:00:00Z');
    let guard=0;
    while(d<=endD&&guard<730){(byDay[d.toISOString().slice(0,10)]=byDay[d.toISOString().slice(0,10)]||[]).push(ph);d=addDays(d,1);guard++}
  });

  const cells=[];
  for(let i=firstDow-1;i>=0;i--)cells.push({n:prevDays-i,out:true});
  for(let d=1;d<=daysInMonth;d++)cells.push({n:d,out:false,key:yy+'-'+String(mm).padStart(2,'0')+'-'+String(d).padStart(2,'0')});
  let nextN=1;while(cells.length%7!==0)cells.push({n:nextN++,out:true});

  const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  let html='<div class="crono-cal">'+
    '<div class="crono-cal-head">'+
      '<button class="ph-btn" data-action="crono-cal-nav" data-dir="-1" title="Mês anterior">‹</button>'+
      '<span class="crono-cal-title">'+MONTHS[mi]+' '+yy+'</span>'+
      '<button class="ph-btn" data-action="crono-cal-nav" data-dir="1" title="Próximo mês">›</button>'+
      '<button class="btn btn-sm btn-s" data-action="crono-cal-today" style="margin-left:auto">Hoje</button>'+
    '</div>'+
    '<div class="crono-cal-grid crono-cal-wd">'+WD.map(w=>'<div>'+w+'</div>').join('')+'</div>'+
    '<div class="crono-cal-grid">';

  cells.forEach(c=>{
    if(c.out){html+='<div class="crono-cal-cell out"><span class="cd-num">'+c.n+'</span></div>';return}
    const items=byDay[c.key]||[];
    const isToday=c.key===todayStr,isSel=c.key===S.cronoCalSelDate;
    const shown=items.slice(0,8),more=items.length-shown.length;
    html+='<div class="crono-cal-cell'+(isToday?' today':'')+(isSel?' sel':'')+(items.length?' has':'')+'" data-action="crono-cal-day" data-date="'+c.key+'">'+
      '<span class="cd-num">'+c.n+'</span><div class="cd-items">'+
      shown.map(ph=>{
        const delayed=ph.endDate&&ph.endDate<todayStr&&(ph.progress||0)<100;
        const bg=delayed?'var(--err)':ph.progress>=100?'var(--ok)':'var(--accent)';
        return'<span class="cd-dot" style="background:'+bg+'" title="'+esc(ph.name)+'"></span>';
      }).join('')+
      (more>0?'<span class="cd-more">+'+more+'</span>':'')+'</div></div>';
  });
  html+='</div>';

  if(S.cronoCalSelDate){
    const items=byDay[S.cronoCalSelDate]||[];
    html+='<div class="crono-cal-day-panel"><h4>'+fmtD(S.cronoCalSelDate)+'</h4>';
    if(!items.length)html+='<p style="color:var(--text-3);font-size:.85rem">Nenhuma etapa neste dia.</p>';
    else items.forEach(ph=>{
      const delayed=ph.endDate&&ph.endDate<todayStr&&(ph.progress||0)<100;
      const stLabel=ph.progress>=100?'Concluída':ph.progress>0?ph.progress+'% realizado':'Não iniciada';
      const sd=new Date(ph.startDate+'T00:00:00Z');
      html+='<div class="agenda-item" style="border-left-color:'+(delayed?'var(--err)':'var(--accent)')+';margin-bottom:.5rem">'+
        '<div class="agenda-date"><div class="day">'+String(sd.getUTCDate()).padStart(2,'0')+'</div><div class="month-s">'+MONTHS[sd.getUTCMonth()].slice(0,3)+'</div></div>'+
        '<div class="agenda-info"><h4>'+esc(ph.name)+(ph.additional?' <span class="additional-badge">ADICIONAL</span>':'')+'</h4><div class="agenda-meta" style="align-items:center">'+
          '<span>'+fmtD(ph.startDate)+' → '+fmtD(ph.endDate)+'</span><span>'+esc(ph.cat)+'</span>'+
          (delayed?'<span class="crono-status-late">ATRASADA</span>':'<span>'+stLabel+'</span>')+
        '</div></div></div>';
    });
    html+='</div>';
  }
  return html;
}

  const filteredTC=filtered.reduce((s,ph)=>s+(ph.totalCost||0),0);

  const catOrd=[],catM={};let n=0;
  filtered.forEach(ph=>{if(!catM[ph.cat]){catM[ph.cat]=[];catOrd.push(ph.cat)}catM[ph.cat].push({ph,n:++n})});

  let rows='';

    catM[cat].forEach(({ph,n})=>{

function scaleTooltip(paid,realized){
  const diff=paid-realized;
  if(Math.abs(diff)<=1)return'Pagamento equilibrado com o realizado';
  if(diff>0)return'Cliente pagou '+fmt(diff)+' a mais que o realizado';
  return'Falta pagar '+fmt(-diff)+' ao prestador';
}

function projProg(p){
  const fp=fairPayment(p);
  const q=(S.progSearch||'').toLowerCase();
  const list=p.phases.filter(ph=>!q||ph.name.toLowerCase().includes(q)||ph.cat.toLowerCase().includes(q));

  let html='<div class="summary-grid" style="margin-bottom:1.5rem">'+
    '<div class="sum-card"><h4>Orçamento Total</h4><div class="val">'+fmt(fp.budget)+'</div></div>'+
    '<div class="sum-card"><h4>Realizado</h4><div class="val" style="color:var(--accent)">'+fmt(fp.fair)+'</div><div class="sub">'+fp.progress.toFixed(1)+'% do total</div></div>'+
    '<div class="sum-card"><h4>Pago</h4><div class="val" style="color:var(--ok)">'+fmt(fp.paid)+'</div></div>'+
    '<div class="sum-card"><h4>Saldo</h4><div class="val '+(fp.delta>10?'delta-pos':fp.delta<-10?'delta-neg':'delta-zero')+'">'+fmt(fp.delta)+'</div></div></div>'+
    '<div class="search-bar">'+IC.search+'<input type="text" id="prog-search" placeholder="Buscar etapa ou categoria..." value="'+esc(S.progSearch||'')+'"></div>';

  if(!list.length){html+='<p style="color:var(--text-3)">Nenhuma etapa encontrada.</p>';return html}

  const catOrd=[],catM={};
  list.forEach(ph=>{if(!catM[ph.cat]){catM[ph.cat]=[];catOrd.push(ph.cat)}catM[ph.cat].push(ph)});

  catOrd.forEach(cat=>{
    const catPhases=catM[cat];
    const catCost=catPhases.reduce((s,ph)=>s+(ph.totalCost||0),0);
    const catProg=catCost?catPhases.reduce((s,ph)=>s+(ph.progress||0)*(ph.totalCost||0),0)/catCost:0;
    const isOpen=S.openCats[cat]===true;
    html+='<div class="prog-cat-header'+(isOpen?'':' closed')+'" data-action="toggle-cat" data-cat="'+esc(cat)+'">'+
      '<div class="left"><span class="chev">'+IC.chev+'</span><span>'+esc(cat)+'</span></div>'+
      '<span class="prog-cat-info">'+catPhases.length+' serviço(s) · '+fmt(catCost)+' · '+catProg.toFixed(0)+'% médio</span>'+
    '</div>';
    if(!isOpen)return;
    html+='<div class="prog-cat-body">';
    catPhases.forEach(ph=>{
      const payable=ph.totalCost*(ph.progress||0)/100;
      const diff=payable-(ph.paid||0);
      const diffC=diff>1?'delta-pos':diff<-1?'delta-neg':'delta-zero';
      const sc=scaleTilt(ph.paid||0,payable);
      const pays=ph.payments||[];
      const u=ph.unit||'m²';
      const qtyDone=ph.qtyDone!=null?ph.qtyDone:(ph.qty||1)*(ph.progress||0)/100;
      const isPhOpen=!!S.openPhaseDetail[ph.id];
      html+='<div class="prog-phase'+(ph.additional?' additional-left':'')+'">'+
        '<div class="prog-phase-header"><span class="prog-phase-name">'+esc(ph.name)+(ph.additional?' <span class="additional-badge">ADICIONAL</span>':'')+'</span><span class="prog-phase-val">Valor total: '+fmt(ph.totalCost)+'</span></div>'+
        '<div class="prog-summary-row">'+
          '<div class="prog-bar" style="flex:1;margin-top:0"><div class="prog-fill" style="width:'+(ph.progress||0)+'%;background:var(--ok)"></div></div>'+
          '<span class="prog-pct">'+(ph.progress||0)+'%</span>'+
          '<button class="btn-ghost prog-toggle-btn" data-action="toggle-phase-detail" data-phase="'+ph.id+'">'+(isPhOpen?'Ocultar':'Detalhamento')+' <span class="chev" style="'+(isPhOpen?'':'transform:rotate(-90deg)')+'">'+IC.chev+'</span></button>'+
        '</div>'+
        (!isPhOpen?'':(
        '<div class="prog-controls">'+
          '<input class="prog-slider" type="range" min="0" max="100" value="'+(ph.progress||0)+'" data-action="edit-progress" data-phase="'+ph.id+'">'+
          '<span class="prog-pct">'+(ph.progress||0)+'%</span>'+
          '<span class="scale-wrap" title="'+esc(scaleTooltip(ph.paid||0,payable))+'">'+scaleSVG(sc.rot,sc.color)+'</span>'+
        '</div>'+
        (u!=='vb'?'<div class="qty-done-row"><label>Medição realizada:</label>'+
          '<input type="number" min="0" step="0.01" max="'+(ph.qty||1)+'" value="'+(+qtyDone.toFixed(2))+'" data-action="edit-qtydone" data-phase="'+ph.id+'">'+
          '<span class="unit-lbl">/ '+(ph.qty||1)+' '+u+'</span>'+
          '<span style="color:var(--text-3);font-size:.75rem;margin-left:auto">Ajusta o % automaticamente</span>'+
        '</div>':'')+
        '<div class="prog-detail">'+
          '<div class="prog-detail-item"><div class="label">Valor Total</div><div class="value">'+fmt(ph.totalCost)+'</div></div>'+
          '<div class="prog-detail-item"><div class="label">Valor Realizado</div><div class="value">'+fmt(payable)+'</div></div>'+
          '<div class="prog-detail-item"><div class="label">Já Pago</div><div class="value">'+fmt(ph.paid||0)+'</div></div>'+
          '<div class="prog-detail-item"><div class="label">Saldo</div><div class="value '+diffC+'">'+fmt(diff)+'</div></div>'+
        '</div>'+
        '<div style="display:flex;gap:.5rem;align-items:center;margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border);flex-wrap:wrap">'+
          '<label style="font-size:.8rem;color:var(--text-2)">Novo Pagamento:</label>'+
          '<input type="number" class="prog-paid-input" id="pay-input-'+ph.id+'" min="0" step="0.01" placeholder="0,00">'+
          '<label class="btn-ghost" style="cursor:pointer">'+IC.clip+' Recibo<input type="file" accept="image/*" data-action="attach-receipt" data-phase="'+ph.id+'" style="display:none"></label>'+
          '<button class="btn btn-sm btn-p" data-action="add-payment" data-phase="'+ph.id+'">'+IC.plus+' Adicionar</button>'+
        '</div>'+
        (pays.length?'<div style="margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--border)"><div style="font-size:.75rem;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Histórico de Pagamentos</div><div class="pay-history">'+
          pays.slice().reverse().map(pay=>'<div class="pay-record">'+
            '<span class="pay-date">'+fmtD(pay.date)+'</span>'+
            '<span class="pay-amt">'+fmt(pay.amount)+'</span>'+
            (pay.receipt?'<img class="pay-receipt-thumb" src="'+pay.receipt+'" data-action="view-receipt" data-phase="'+ph.id+'" data-pay="'+pay.id+'" title="Ver recibo">':'<span style="color:var(--text-3);font-size:.7rem">Sem recibo</span>')+
            '<button class="btn-ghost" data-action="delete-payment" data-phase="'+ph.id+'" data-pay="'+pay.id+'" style="color:var(--err);margin-left:auto" title="Excluir">'+IC.xmark+'</button>'+
          '</div>').join('')+
        '</div></div>':'')
        ))+
      '</div>';
    });
    html+='</div>';
  });
  return html;
}

function projAdicionais(p){
  const orig=p.phases.filter(ph=>!ph.additional),add=p.phases.filter(ph=>ph.additional);
  const origBudget=orig.reduce((s,ph)=>s+(ph.totalCost||0),0),addBudget=add.reduce((s,ph)=>s+(ph.totalCost||0),0);
  const total=origBudget+addBudget;

  let html='<div class="summary-grid" style="margin-bottom:1.5rem">'+
    '<div class="sum-card"><h4>Orçamento Original</h4><div class="val">'+fmt(origBudget)+'</div></div>'+
    '<div class="sum-card"><h4>Serviços Adicionais</h4><div class="val" style="color:var(--warn)">'+fmt(addBudget)+'</div><div class="sub">'+add.length+' item(ns)</div></div>'+
    '<div class="sum-card"><h4>Total Atualizado</h4><div class="val" style="color:var(--accent)">'+fmt(total)+'</div></div></div>'+
    '<div style="margin-bottom:1rem"><button class="btn btn-p" data-action="add-additional">'+IC.plus+' Adicionar Serviço Adicional</button></div>';

  if(!add.length){
    html+='<p style="color:var(--text-3)">Nenhum serviço adicional registrado ainda.</p>';
  } else {
    html+='<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Etapa</th><th>Categoria</th><th class="r">Duração</th><th>Início</th><th>Término</th><th class="r">Custo</th><th class="r">Progresso</th><th></th></tr></thead><tbody>'+
      add.map((ph,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(ph.name)+' <span class="additional-badge">ADICIONAL</span></td><td>'+esc(ph.cat)+'</td><td class="r">'+ph.duration+'d</td><td>'+fmtD(ph.startDate)+'</td><td>'+fmtD(ph.endDate)+'</td><td class="r">'+fmt(ph.totalCost)+'</td><td class="r">'+(ph.progress||0)+'%</td><td class="r"><button class="btn-ghost" data-action="remove-additional" data-phase="'+ph.id+'" style="color:var(--err)" title="Remover">'+IC.trash+'</button></td></tr>').join('')+
      '</tbody></table></div>';
  }
  return html;
}

      tblRows+='<tr><td>'+n+'</td><td>'+esc(ph.name)+(ph.additional?' <span class="additional-badge">ADICIONAL</span>':'')+'</td><td class="r">'+ph.duration+' dias</td><td class="r">'+(ph.unit||'m²')+'</td><td class="r">'+(ph.qty||1)+'</td><td class="r">'+fmt(ph.costPerUnit!=null?ph.costPerUnit:ph.costPerSqm)+'</td><td class="r">'+fmt(ph.totalCost)+'</td><td>'+miniProg(ph.progress||0)+'</td><td class="r">'+fmt(payable)+'</td><td class="r">'+fmt(ph.paid||0)+'</td><td class="r">'+fmt(payable-(ph.paid||0))+'</td></tr>';
    });
  });

  return'<div style="min-height:100vh;background:var(--bg);padding:1.5rem 1rem">'+
    '<div style="display:flex;justify-content:flex-end;max-width:1200px;margin:0 auto .75rem">'+
      '<button class="header-btn" data-action="toggle-theme" title="'+(isDark?'Modo Claro':'Modo Escuro')+'" style="border:1px solid var(--border);background:var(--surface)">'+(isDark?IC.sun:IC.moon)+'</button>'+
    '</div>'+
    '<div class="scope-doc">'+
      '<div class="scope-header">'+(d.logo?'<img class="scope-logo" src="'+d.logo+'" alt="Logo">':'')+
      '<div class="scope-company">'+esc(d.company||'')+'</div>'+
      '<div class="scope-contact" style="margin-top:6px">'+[d.company_address,d.phone,d.contact_email,d.cnpj].filter(Boolean).map(esc).join(' · ')+'</div></div>'+
      '<div class="scope-title">Escopo e Acompanhamento</div>'+
      '<div class="scope-section"><div style="margin-bottom:.75rem"><h3 style="margin-bottom:.5rem">Dados do Projeto</h3>'+
        '<div style="font-size:.75rem;color:var(--text-3)">Atualizado em <strong style="color:var(--text-2)">'+fmtD(todayLocal())+'</strong></div></div>'+
        '<table class="scope-data-tbl"><tbody>'+
        '<tr><td class="lbl">Projeto</td><td class="val">'+esc(p.name)+'</td><td class="lbl">Tipo</td><td class="val">'+(TYPES[p.type]?TYPES[p.type].name:p.type)+'</td></tr>'+
        '<tr><td class="lbl">Status</td><td class="val">'+statusLabel(p.status)+'</td><td class="lbl">Prazo Total</td><td class="val">'+td+' dias</td></tr>'+
        '</tbody>'+
        (S.escopoExpanded?'<tbody>'+
        '<tr><td class="lbl">Cliente</td><td class="val">'+esc(p.client||'—')+'</td><td class="lbl">Endereço</td><td class="val">'+esc(p.address||'—')+'</td></tr>'+
        '<tr><td class="lbl">Data de Início</td><td class="val">'+fmtD(p.startDate)+'</td><td class="lbl">Previsão</td><td class="val">'+fmtD(last)+'</td></tr>'+
        '</tbody>':'')+
      '</table>'+
      '<button class="btn-ghost" data-action="toggle-escopo-detail" style="margin-top:.5rem;font-size:.78rem;display:inline-flex;align-items:center;gap:4px">'+(S.escopoExpanded?'Ler menos':'Ler mais')+' <span class="chev" style="display:inline-flex;transition:transform .2s;'+(S.escopoExpanded?'':'transform:rotate(-90deg)')+'">'+IC.chev+'</span></button>'+
      '</div>'+
      '<div class="scope-section"><h3>Orçamento, Prazos e Medição</h3><div class="scope-table-wrap"><table class="scope-table">'+
        '<thead><tr><th>#</th><th>Etapa</th><th class="r">Prazo</th><th class="r">Und</th><th class="r">Qtd</th><th class="r">R$/Und</th><th class="r">Valor Total</th><th>Realizado</th><th class="r">Valor Prop.</th><th class="r">Pago</th><th class="r">Saldo</th></tr></thead><tbody>'+
        tblRows+
        '<tr class="total-row"><td></td><td>Total</td><td class="r">'+td+' dias</td><td></td><td></td><td></td><td class="r">'+fmt(fp.budget)+'</td><td>'+fp.progress.toFixed(1)+'%</td><td class="r">'+fmt(fp.fair)+'</td><td class="r">'+fmt(fp.paid)+'</td><td class="r">'+fmt(fp.delta)+'</td></tr></tbody></table></div></div>'+
      '<div style="text-align:center;margin-top:2rem;font-size:.75rem;color:var(--text-3)">Atualizado em '+fmtD(todayLocal())+'</div>'+
    '</div>'+
    '<div style="text-align:center;margin-top:1.25rem;font-size:.72rem;color:var(--text-3)">Gerado com <strong>Arq-Plano</strong></div>'+
  '</div>';
}

      '<div class="form-row"><div class="form-group"><label>CNPJ / CPF</label><input type="text" id="s-cnpj" value="'+esc(st.cnpj)+'"></div>'+

        list.map(co=>'<div class="company-list-item'+(co.company===st.company&&co.cnpj===st.cnpj?' active':'')+'"><div class="name" data-action="select-company" data-id="'+co.id+'">'+esc(co.company||'(sem nome)')+'<small>'+esc(co.cnpj||'')+(co.phone?' · '+esc(co.phone):'')+'</small></div><button class="btn-ghost" data-action="delete-company" data-id="'+co.id+'" style="color:var(--err)">'+IC.trash+'</button></div>').join('')+

async function printScope(){
  const p=getProject();if(!p)return;
  const safeName=p.name.replace(/[^a-zA-Z0-9]/g,'_');
  const pdfBytes=buildPdf(p,'escopo');
  if(window.claude&&typeof window.claude.use==='function'){
    const dl=await window.claude.use('downloads').catch(()=>null);
    if(dl){
      try{await dl.save({filename:'escopo-'+safeName+'.pdf',data:pdfBytes.slice(0).buffer});showToast('PDF gerado!');return}
      catch(e){if(e&&e.code==='declined')return}
    }
  }
  const blob=new Blob([pdfBytes],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='escopo-'+safeName+'.pdf';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast('PDF gerado!');
}

function buildPdf(p,variant){
  variant=variant||'orcamento';
  const st=S.settings,fp=fairPayment(p);
  const td=p.phases.reduce((s,ph)=>s+ph.duration,0);
  const last=p.phases.length?fmtD(p.phases[p.phases.length-1].endDate):'—';
  const gen=fmtD(todayLocal());
  const W=842,H=595,M=36,cW=W-M*2;
  const enc=s=>{let o='';for(const c of String(s||'')){const cp=c.codePointAt(0);if(c==='('||c===')'||c==='\\')o+='\\'+c;else if(cp<0x80)o+=c;else if(cp<0x100)o+='\\'+cp.toString(8).padStart(3,'0');else o+='?'}return'('+o+')'};
  const tw=(s,sz)=>String(s).length*sz*0.5;
  const tr=(s,mw,sz)=>{s=String(s||'');if(tw(s,sz)<=mw)return s;while(s.length&&tw(s+'...',sz)>mw)s=s.slice(0,-1);return s+'...'};
  const ops=[];
  const rect=(x,y,w,h,fill)=>{if(fill)ops.push(fill.join(' ')+' rg '+x+' '+y+' '+w+' '+h+' re f')};
  const rectS=(x,y,w,h,c)=>{ops.push(c.join(' ')+' RG '+x+' '+y+' '+w+' '+h+' re S')};
  const txt=(s,x,y,sz,font,col,align,mw)=>{if(col)ops.push(col.join(' ')+' rg');const t=mw?tr(s,mw-6,sz):String(s);let dx=x+3;if(align==='r'&&mw)dx=x+mw-3-tw(t,sz);else if(align==='c'&&mw)dx=x+(mw-tw(t,sz))/2;ops.push('BT /'+(font||'F1')+' '+sz+' Tf '+dx+' '+y+' Td '+enc(t)+' Tj ET')};
  const line=(x1,y1,x2,y2,c)=>{if(c)ops.push(c.join(' ')+' RG');ops.push(x1+' '+y1+' m '+x2+' '+y2+' l S')};

  const cols=[
    {t:'#',w:22,a:'r'},{t:'Etapa',w:150,a:'l'},{t:'Categoria',w:80,a:'l'},{t:'Dias',w:30,a:'r'},
    {t:'Início',w:52,a:'r'},{t:'Término',w:52,a:'r'},{t:'Und',w:28,a:'r'},{t:'Qtd',w:36,a:'r'},
    {t:'R$/Und',w:52,a:'r'},{t:'Total',w:58,a:'r'},{t:'%',w:32,a:'c'},{t:'Prop.',w:56,a:'r'},{t:'Pago',w:56,a:'r'},{t:'Saldo',w:66,a:'r'}
  ];
  const BLUE=[0.14,0.16,0.25],GREY=[0.93,0.94,0.96],GREY2=[0.27,0.29,0.34],BLACK=[0,0,0],WHITE=[1,1,1],BORDER=[0.81,0.83,0.88],RED=[0.72,0.29,0.25],GREEN=[0.24,0.48,0.37];
  const pages=[];const rowH=13;let y=H-M;

  const useProjLogo=!!p.logo;
  const logoSrc=useProjLogo?p.logo:st.logo;
  const pLogoW=useProjLogo?(p.logoW||0):(st.logoW||0),pLogoH=useProjLogo?(p.logoH||0):(st.logoH||0);
  let logoDrawW=0,logoDrawH=0;
  if(logoSrc&&pLogoW&&pLogoH&&/^data:image\/jpe?g;base64,/i.test(logoSrc)){
    const maxH=variant==='escopo'?110:90,maxW=variant==='escopo'?220:180;
    const sc=Math.min(maxW/pLogoW,maxH/pLogoH,1);
    logoDrawW=pLogoW*sc;logoDrawH=pLogoH*sc;
  }
  const hasLogo=logoDrawW>0;
  const contact=[st.address,st.phone,st.email,st.cnpj].filter(Boolean).join(' · ');

  if(hasLogo){y-=logoDrawH+8}
  if(st.company){txt(st.company,W/2-tw(st.company,16)/2-3,y-16,16,'F2',BLUE);y-=22}
  if(contact){txt(contact,W/2-tw(contact,9)/2-3,y-10,9,'F1',GREY2);y-=16}
  y-=4;
  line(M,y,W-M,y,BLUE);y-=20;
  const title=variant==='escopo'?'ESCOPO E ACOMPANHAMENTO':'ORÇAMENTO';
  txt(title,W/2-tw(title,14)/2-3,y-13,14,'F2',BLACK);y-=22;
  txt('Dados do Projeto',M-3,y-11,11,'F2',BLACK);y-=16;

  const dataRows=[
    ['Projeto:',p.name,'Cliente:',p.client||'—'],
    ['Endereço:',p.address||'—','Status:',statusLabel(p.status)],
    ['Início:',fmtD(p.startDate),'Previsão:',last],
    ['Prazo total:',td+' dias','Emitido em:',gen]
  ];
  const c1=80,c2=250,c3=80;
  dataRows.forEach(row=>{
    const isEmit=row[2]==='Emitido em:';
    txt(row[0],M-3,y-9,9,'F2',GREY2,null,c1);
    txt(row[1],M+c1-3,y-9,9,'F1',BLACK,null,c2);
    txt(row[2],M+c1+c2-3,y-9,9,'F2',isEmit?RED:GREY2,null,c3);
    txt(row[3],M+c1+c2+c3-3,y-9,9,isEmit?'F2':'F1',BLACK,null,c2);
    y-=13;
  });
  y-=10;
  txt('Orçamento, Prazos e Medição',M-3,y-11,11,'F2',BLACK);y-=18;

  const drawHeader=()=>{
    rect(M,y-rowH,cW,rowH,BLUE);
    let x=M;
    cols.forEach(col=>{txt(col.t,x,y-rowH+3,8,'F2',WHITE,col.a,col.w);x+=col.w});
    y-=rowH;
  };
  drawHeader();

  const catOrd=[],catM={};let n=0;
  p.phases.forEach(ph=>{if(!catM[ph.cat]){catM[ph.cat]=[];catOrd.push(ph.cat)}catM[ph.cat].push({ph,n:++n})});

  const chkPage=()=>{
    if(y<M+rowH*2){
      pages.push(ops.slice());ops.length=0;y=H-M;drawHeader();
    }
  };

  catOrd.forEach(cat=>{
    chkPage();
    rect(M,y-rowH,cW,rowH,GREY);
    txt(cat.toUpperCase(),M,y-rowH+3,8,'F2',GREY2);
    y-=rowH;
    catM[cat].forEach(({ph,n})=>{
      chkPage();
      const pay=ph.totalCost*(ph.progress||0)/100,saldo=pay-(ph.paid||0);
      const saldoCol=saldo>1?RED:saldo<-1?GREEN:GREY2;
      const vals=[
        String(n),ph.name+(ph.additional?' (AD)':''),ph.cat,String(ph.duration),
        fmtD(ph.startDate),fmtD(ph.endDate),ph.unit||'m²',String(ph.qty||1),
        'R$ '+Number(ph.costPerUnit||0).toFixed(2),'R$ '+(ph.totalCost||0).toFixed(2),
        (ph.progress||0)+'%','R$ '+pay.toFixed(2),'R$ '+(ph.paid||0).toFixed(2),'R$ '+saldo.toFixed(2)
      ];
      rectS(M,y-rowH,cW,rowH,BORDER);
      let x=M;
      vals.forEach((v,i)=>{
        const col=cols[i];
        const c=i===13?saldoCol:BLACK;
        const f=(i===13&&Math.abs(saldo)>1)?'F2':'F1';
        txt(v,x,y-rowH+3,8,f,c,col.a,col.w);
        x+=col.w;
      });
      y-=rowH;
    });
  });

  chkPage();
  rect(M,y-rowH,cW,rowH,GREY);
  const totals=['','TOTAL','',td+'d','','','','','','R$ '+fp.budget.toFixed(2),fp.progress.toFixed(1)+'%','R$ '+fp.fair.toFixed(2),'R$ '+fp.paid.toFixed(2),'R$ '+fp.delta.toFixed(2)];
  let tx=M;
  totals.forEach((v,i)=>{const col=cols[i];txt(v,tx,y-rowH+3,8,'F2',BLACK,col.a,col.w);tx+=col.w});
  y-=rowH;

  // Footer with generation date
  y=M;
  txt('Documento gerado em '+gen+(st.company?' · '+st.company:''),M-3,y-4,7,'F1',GREY2);

  pages.push(ops.slice());

  const objs=[];
  const addObj=c=>{objs.push(c);return objs.length};
  const fF1=addObj('<</Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding>>');
  const fF2=addObj('<</Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding>>');

  let imgId=null,logoOp='';
  if(hasLogo){
    try{
      const b64=logoSrc.split(',')[1];
      const raw=atob(b64);
      imgId=addObj('<</Type /XObject /Subtype /Image /Width '+pLogoW+' /Height '+pLogoH+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+raw.length+'>>\nstream\n'+raw+'\nendstream');
      const lx=(W-logoDrawW)/2,ly=H-M-logoDrawH;
      logoOp='q '+logoDrawW.toFixed(2)+' 0 0 '+logoDrawH.toFixed(2)+' '+lx.toFixed(2)+' '+ly.toFixed(2)+' cm /Im0 Do Q';
    }catch(e){imgId=null}
  }

  const pagesIdx=objs.length+1;
  objs.push(null);
  const pageIds=[];
  pages.forEach((pOps,pi)=>{
    const finalOps=(pi===0&&logoOp)?[logoOp].concat(pOps):pOps;
    const content=finalOps.join('\n');
    const cId=addObj('<</Length '+content.length+'>>\nstream\n'+content+'\nendstream');
    const resXObj=imgId?' /XObject <</Im0 '+imgId+' 0 R>>':'';
    const pId=addObj('<</Type /Page /Parent '+pagesIdx+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources <</Font <</F1 '+fF1+' 0 R /F2 '+fF2+' 0 R>>'+resXObj+'>> /Contents '+cId+' 0 R>>');
    pageIds.push(pId);
  });
  objs[pagesIdx-1]='<</Type /Pages /Kids ['+pageIds.map(id=>id+' 0 R').join(' ')+'] /Count '+pageIds.length+'>>';
  const catId=addObj('<</Type /Catalog /Pages '+pagesIdx+' 0 R>>');

  let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const offs=[0];
  for(let i=0;i<objs.length;i++){offs.push(pdf.length);pdf+=(i+1)+' 0 obj\n'+objs[i]+'\nendobj\n'}
  const xs=pdf.length;
  pdf+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';
  for(let i=1;i<offs.length;i++)pdf+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  pdf+='trailer\n<</Size '+(objs.length+1)+' /Root '+catId+' 0 R>>\nstartxref\n'+xs+'\n%%EOF';

  const bytes=new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&0xFF;
  return bytes;
}

    '</fills>'+
    '<borders count="2">'+
      '<border><left/><right/><top/><bottom/><diagonal/></border>'+

    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+

      '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/>'+// 3 normal cell

      '<xf numFmtId="164" fontId="5" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1"/>'+// 5 saldo negative (green)
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/>'+// 6 currency

      '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf>'+// 10 company title

async function exportPdf(p){
  const safeName=p.name.replace(/[^a-zA-Z0-9]/g,'_');
  const pdfBytes=buildPdf(p,'orcamento');
  if(window.claude&&typeof window.claude.use==='function'){
    const dl=await window.claude.use('downloads').catch(()=>null);
    if(dl){
      try{await dl.save({filename:'orcamento-'+safeName+'.pdf',data:pdfBytes.slice(0).buffer});showToast('PDF gerado!');return}
      catch(e){if(e&&e.code==='declined')return}
    }
  }
  const blob=new Blob([pdfBytes],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='orcamento-'+safeName+'.pdf';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast('PDF gerado!');
}

function exportExcel(p){
  const safeName=p.name.replace(/[^a-zA-Z0-9]/g,'_');
  const zip=buildXlsx(p);
  const doDownload=async()=>{
    if(window.claude&&typeof window.claude.use==='function'){
      const dl=await window.claude.use('downloads').catch(()=>null);
      if(dl){
        try{await dl.save({filename:'relatorio-'+safeName+'.xlsx',data:zip.slice(0).buffer});showToast('Planilha Excel baixada!');return}
        catch(e){
          if(e&&e.code==='declined')return;
          if(e&&(e.code==='rejected_extension'||e.code==='extension_not_enabled')){
            try{await dl.save({filename:'relatorio-'+safeName+'.csv',data:'﻿'+xlsxToCsv(p)});showToast('CSV baixado (formatação limitada)');return}
            catch(e2){if(e2&&e2.code==='declined')return}
          }
        }
      }
    }
    const blob=new Blob([zip],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='relatorio-'+safeName+'.xlsx';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    showToast('Planilha Excel baixada!');
  };
  doDownload().catch(e=>showToast('Erro: '+e.message));
}

function xlsxToCsv(p){
  const fp=fairPayment(p);
  const st=S.settings;
  const q=v=>{if(v==null)return'';const s=String(v);return/[,;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const lines=[];
  if(st.company)lines.push(q(st.company));
  lines.push('Projeto,'+q(p.name)+',Cliente,'+q(p.client||'—'));
  lines.push('Endereço,'+q(p.address||'—')+',Emitido em,'+q(fmtD(todayLocal())));
  lines.push('');
  lines.push('#,Etapa,Categoria,Dias,Início,Término,Und,Qtd,R$/Und,Custo Total,Progresso,Valor Prop.,Pago,Saldo');
  p.phases.forEach((ph,i)=>{
    const pay=ph.totalCost*(ph.progress||0)/100,saldo=pay-(ph.paid||0);
    lines.push([i+1,ph.name,ph.cat,ph.duration,fmtD(ph.startDate),fmtD(ph.endDate),ph.unit||'m²',ph.qty||1,(ph.costPerUnit!=null?ph.costPerUnit:ph.costPerSqm)||0,(ph.totalCost||0).toFixed(2),(ph.progress||0)+'%',pay.toFixed(2),(ph.paid||0).toFixed(2),saldo.toFixed(2)].map(q).join(','));
  });
  return lines.join('\n');
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;

  if(a==='new-project'){S.wizard={step:1,type:null,name:'',client:'',area:100,startDate:todayLocal(),address:'',logo:'',allPhases:[],phases:[]};S.view='wizard';S.addingPhase=null;S.editingPhaseId=null;S.addingAdditional=false;render();return}

  if(a==='auth-switch-mode'){
    if(!ALLOW_SIGNUP){S.authMode='login';render();return}
    S.authMode=S.authMode==='signup'?'login':'signup';S.authError='';S.authInfo='';render();return;
  }
  if(a==='toggle-pwd'){
    const inp=document.getElementById(t.dataset.target);
    if(inp){const isPass=inp.type==='password';inp.type=isPass?'text':'password';t.innerHTML=isPass?IC.eyeOff:IC.eye;t.title=isPass?'Ocultar senha':'Mostrar senha'}
    return;
  }
  if(a==='auth-login'){
    const em=(document.getElementById('auth-email')?.value||'').trim().toLowerCase();
    const pw=document.getElementById('auth-pass')?.value||'';
    if(!em||!pw){S.authError='Preencha e-mail e senha.';S.authInfo='';render();return}
    S.authBusy=true;S.authError='';S.authInfo='';render();
    (async()=>{
      const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
      S.authBusy=false;
      if(error){
        S.authError=/Invalid login/i.test(error.message)?'E-mail ou senha incorretos.'
          :/not confirmed/i.test(error.message)?'Confirme seu e-mail antes de entrar. Verifique sua caixa de entrada.'
          :error.message;
        render();return;
      }
      try{localStorage.setItem('arq-plano-remember',JSON.stringify({email:em,pass:pw}))}catch(e){}
      S.userId=data.user.id;S.currentUser=data.user.email;S.view='dashboard';render();
      try{await loadCloudData()}catch(e){showToast('Erro ao carregar: '+e.message)}
      render();
    })();
    return;
  }
  if(a==='auth-signup'){
    if(!ALLOW_SIGNUP){S.authMode='login';S.authError='Cadastro desativado. Solicite seu acesso ao administrador.';render();return}
    const em=(document.getElementById('auth-email')?.value||'').trim().toLowerCase();
    const pw=document.getElementById('auth-pass')?.value||'';
    const pw2=document.getElementById('auth-pass2')?.value||'';
    if(!em||!pw){S.authError='Preencha e-mail e senha.';S.authInfo='';render();return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){S.authError='E-mail inválido.';render();return}
    if(pw.length<6){S.authError='A senha precisa ter pelo menos 6 caracteres.';render();return}
    if(pw!==pw2){S.authError='As senhas não coincidem.';render();return}
    S.authBusy=true;S.authError='';S.authInfo='';render();
    (async()=>{
      const{data,error}=await sb.auth.signUp({email:em,password:pw});
      S.authBusy=false;
      if(error){
        S.authError=/already registered|already been registered/i.test(error.message)
          ?'Já existe uma conta com esse e-mail.':error.message;
        render();return;
      }
      try{localStorage.setItem('arq-plano-remember',JSON.stringify({email:em,pass:pw}))}catch(e){}
      if(data.session){
        S.userId=data.user.id;S.currentUser=data.user.email;S.view='dashboard';render();
        try{await loadCloudData()}catch(e){}
        render();
      }else{
        S.authMode='login';
        S.authInfo='Conta criada! Enviamos um e-mail de confirmação para '+em+'. Clique no link da mensagem e depois faça login.';
        render();
      }
    })();
    return;
  }
  if(a==='auth-reset'){
    const em=(document.getElementById('auth-email')?.value||'').trim().toLowerCase();
    if(!em){S.authError='Digite seu e-mail acima para receber o link de recuperação.';S.authInfo='';render();return}
    S.authBusy=true;S.authError='';S.authInfo='';render();
    (async()=>{
      const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:window.location.href});
      S.authBusy=false;
      if(error){S.authError=error.message}
      else{S.authInfo='Enviamos um link de recuperação para '+em+'. Verifique sua caixa de entrada e o spam.'}
      render();
    })();
    return;
  }
  if(a==='auth-logout'){
    (async()=>{
      if(dirtyProjects.size||dirtySettings)await flushChanges();
      await sb.auth.signOut();
      S.currentUser=null;S.userId=null;S.projects=[];S.currentId=null;
      S.settings={company:'',cnpj:'',phone:'',email:'',address:'',logo:'',logoW:0,logoH:0,companies:[]};
      S.view='login';S.authMode='login';S.authError='';S.authInfo='';
      render();
    })();
    return;
  }
  if(a==='wiz-remove-logo'){S.wizard.logo='';render();return}
  if(a==='open-admin'){
    if(!isAdmin()){showToast('Acesso restrito ao administrador.');return}
    S.modal='admin-panel';S.adminUsers=[];render();
    (async()=>{
      const{data,error}=await sb.from('profiles').select('id,email,company,created_at').order('created_at',{ascending:true});
      if(error){showToast('Erro: '+error.message);return}
      S.adminUsers=data||[];render();
    })();
    return;
  }
  if(a==='admin-del-user'){
    if(!isAdmin()){showToast('Acesso restrito.');return}
    const em=t.dataset.email,uid2=t.dataset.uid;
    if(em===ADMIN_EMAIL){showToast('Não é possível excluir o administrador.');return}
    if(!confirm('Excluir todos os dados da conta '+em+'?\n\nAs obras e o perfil serão apagados permanentemente.'))return;
    (async()=>{
      const r1=await sb.from('projects').delete().eq('user_id',uid2);
      if(r1.error){showToast('Erro: '+r1.error.message);return}
      const r2=await sb.from('profiles').delete().eq('id',uid2);
      if(r2.error){showToast('Erro: '+r2.error.message);return}
      S.adminUsers=S.adminUsers.filter(u=>u.id!==uid2);
      render();showToast('Dados da conta excluídos');
    })();
    return;
  }
  if(a==='go-dash'){S.view='dashboard';S.editingName=false;render();return}
  if(a==='toggle-theme'){
    const nw=S.theme==='dark'?'light':'dark';
    S.theme=nw;
    document.documentElement.setAttribute('data-theme',nw);
    try{localStorage.setItem('gestor-theme',nw)}catch(e){}
    render();return;

document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.action;

  if(a==='filter-select'){S.dashFilter=t.value;render();return}

  if(a==='attach-receipt'){
    const file=t.files&&t.files[0];if(!file)return;
    compressImg(file,url=>{pendingReceipts[t.dataset.phase]=url;showToast('Recibo anexado')});return;
  }

  if(a==='wiz-logo-upload'){
    const file=t.files&&t.files[0];if(!file)return;
    if(file.type==='application/pdf'){showToast('PDF não é suportado como logo. Use JPG ou PNG.');t.value='';return}
    if(!/^image\/(jpeg|jpg|png)$/i.test(file.type)){showToast('Formato não suportado. Use JPG ou PNG.');t.value='';return}
    const r=new FileReader();
    r.onload=function(e){
      const img=new Image();
      img.onload=function(){
        const c=document.createElement('canvas');let w=img.width,h=img.height;
        if(w>400){h=h*400/w;w=400}
        c.width=w;c.height=h;
        const ctx=c.getContext('2d');
        // JPEG não tem canal alpha: pinta fundo branco para transparência não virar preto
        ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        S.wizard.logo=c.toDataURL('image/jpeg',0.92);
        S.wizard.logoW=w;S.wizard.logoH=h;
        showToast('Logo anexado');render();
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
    return;
  }

  if(t.id==='s-logo'){
    const file=t.files&&t.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=function(){
        const c=document.createElement('canvas');let w=img.width,h=img.height;
        if(w>400){h=h*400/w;w=400}
        c.width=w;c.height=h;
        const ctx=c.getContext('2d');
        ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        S.settings.logo=c.toDataURL('image/jpeg',0.92);
        S.settings.logoW=w;S.settings.logoH=h;
        save();render();
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);return;
  }

  if(a==='change-status'){const p=getProject();if(p){p.status=t.value;save();render()}return}

  if(a==='edit-wiz-dur'){const i=parseInt(t.dataset.idx),w=S.wizard;w.phases[i].duration=Math.max(1,parseInt(t.value)||1);recalcFrom(w.phases,i);render();return}
  if(a==='edit-wiz-start'){const i=parseInt(t.dataset.idx),w=S.wizard;w.phases[i].startDate=t.value;recalcFrom(w.phases,i);render();return}
  if(a==='edit-wiz-cost'){const i=parseInt(t.dataset.idx),w=S.wizard;w.phases[i].costPerUnit=Math.max(0,parseFloat(t.value)||0);w.phases[i].totalCost=w.phases[i].costPerUnit*w.phases[i].qty;render();return}
  if(a==='edit-wiz-unit'){const i=parseInt(t.dataset.idx),w=S.wizard,p=w.phases[i];p.unit=t.value;if(t.value==='vb')p.qty=1;p.totalCost=p.costPerUnit*p.qty;render();return}
  if(a==='edit-wiz-qty'){const i=parseInt(t.dataset.idx),w=S.wizard,p=w.phases[i];p.qty=Math.max(0.01,parseFloat(t.value)||1);p.totalCost=p.costPerUnit*p.qty;render();return}

  if(a==='edit-cost'){const p=getProject();if(!p)return;const ph=p.phases.find(x=>x.id===t.dataset.phase);if(ph){ph.costPerUnit=Math.max(0,parseFloat(t.value)||0);ph.totalCost=ph.costPerUnit*(ph.qty||1);save();render()}return}
  if(a==='edit-unit'){const p=getProject();if(!p)return;const ph=p.phases.find(x=>x.id===t.dataset.phase);if(ph){ph.unit=t.value;if(t.value==='vb')ph.qty=1;ph.totalCost=(ph.costPerUnit||0)*ph.qty;ph.qtyDone=(ph.qty||1)*(ph.progress||0)/100;save();render()}return}
  if(a==='edit-qty'){const p=getProject();if(!p)return;const ph=p.phases.find(x=>x.id===t.dataset.phase);if(ph){ph.qty=Math.max(0.01,parseFloat(t.value)||1);ph.totalCost=(ph.costPerUnit||0)*ph.qty;ph.qtyDone=Math.min(ph.qtyDone||0,ph.qty);ph.progress=Math.round((ph.qtyDone/ph.qty)*100);save();render()}return}
  if(a==='edit-paid'){const p=getProject();if(!p)return;const ph=p.phases.find(x=>x.id===t.dataset.phase);if(ph){ph.paid=Math.max(0,parseFloat(t.value)||0);save();render()}return}
  if(a==='edit-orc-name'){const p=getProject();if(!p)return;const ph=p.phases.find(x=>x.id===t.dataset.phase);if(ph&&t.value.trim()){ph.name=t.value.trim();save()}return}

  if(a==='edit-total-cost'){const p=getProject();if(!p)return;const ph=p.phases.find(x=>x.id===t.dataset.phase);if(ph){ph.totalCost=Math.max(0,parseFloat(t.value)||0);ph.costPerUnit=ph.totalCost/(ph.qty||1);save();render()}return}
  if(a==='edit-crono-start'){const p=getProject();if(!p)return;const ph=p.phases.find(x=>x.id===t.dataset.phase);if(ph&&t.value){ph.startDate=t.value;ph.endDate=addDays(ph.startDate,ph.duration).toISOString().slice(0,10);save();render()}return}

  if(a==='edit-phase-days'){const ph=S.wizard.allPhases.find(p=>p.id===t.dataset.phase);if(ph)ph.days=Math.max(1,parseInt(t.value)||1);return}
  if(a==='edit-phase-cost'){const ph=S.wizard.allPhases.find(p=>p.id===t.dataset.phase);if(ph){ph.cost=Math.max(0,parseFloat(t.value)||0);render()}return}
  if(a==='edit-phase-unit'){const ph=S.wizard.allPhases.find(p=>p.id===t.dataset.phase);if(ph){ph.unit=t.value;if(t.value==='vb')ph.qty=1;render()}return}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='prog-search'){
    S.progSearch=t.value;render();
    const el=document.getElementById('prog-search');
    if(el){el.focus();const v=el.value;el.setSelectionRange(v.length,v.length)}
    return;
  }
  if(t.id==='orc-search'){
    S.orcSearch=t.value;render();
    const el=document.getElementById('orc-search');
    if(el){el.focus();const v=el.value;el.setSelectionRange(v.length,v.length)}
    return;
  }
  if(t.dataset.action==='edit-progress'){
    const p=getProject();if(!p)return;
    const ph=p.phases.find(x=>x.id===t.dataset.phase);
    if(ph){ph.progress=parseInt(t.value)||0;ph.qtyDone=(ph.qty||1)*ph.progress/100;save();
      const pct=t.parentElement.querySelector('.prog-pct');if(pct)pct.textContent=ph.progress+'%';
      const fill=t.closest('.prog-phase').querySelector('.prog-fill');if(fill)fill.style.width=ph.progress+'%';
      const phaseEl=t.closest('.prog-phase');
      const qdInput=phaseEl.querySelector('[data-action="edit-qtydone"]');if(qdInput)qdInput.value=(+ph.qtyDone.toFixed(2));
      const detail=phaseEl.querySelector('.prog-detail');
      if(detail){
        const payable=ph.totalCost*ph.progress/100;const diff=payable-(ph.paid||0);
        const items=detail.querySelectorAll('.prog-detail-item .value');
        if(items[1])items[1].textContent=fmt(payable);
        if(items[3]){items[3].textContent=fmt(diff);items[3].className='value '+(diff>1?'delta-pos':diff<-1?'delta-neg':'delta-zero')}
      }
    }
    return;
  }
});

document.addEventListener('keydown',e=>{

    if(e.target.id==='new-cat-name'){document.querySelector('[data-action="confirm-add-cat"]')?.click()}
    if(e.target.dataset&&e.target.dataset.editField){e.preventDefault();e.target.blur()}
  }
  if(e.key==='Escape'){
    if(S.editingName){S.editingName=false;render()}
    if(S.editingPhaseId){S.editingPhaseId=null;render()}
    if(S.addingPhase){S.addingPhase=null;render()}
    if(S.modal){S.modal=null;S.addingAdditional=false;render()}
  }
});

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
if(!window.supabase){
  document.getElementById('app').innerHTML=
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;font-family:system-ui">'+
    '<div><h2 style="margin-bottom:.75rem">Sem conexão</h2>'+
    '<p style="color:#666;max-width:380px">Não foi possível carregar os componentes do sistema. '+
    'Verifique sua conexão com a internet e recarregue a página.</p></div></div>';
}else{
  bootSession();
  // Mantém a sessão sincronizada entre abas
  sb.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'&&S.currentUser){
      S.currentUser=null;S.userId=null;S.projects=[];S.view='login';render();
    }
  });
}
</script>
